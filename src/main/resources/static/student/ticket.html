<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>식권(QR) · 학식 예약</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="m-app">
  <header class="m-top">

    <h1>식권(QR)</h1>
    <button class="btn-link" type="button" onclick="logout()">로그아웃</button>
  </header>
  <!-- S05 식권(QR) (FR-07, FR-09, UC-06, UC-08) -->
  <main class="m-main">
    <div class="qr-wrap" id="qr"></div>
    <div style="text-align:center;margin-top:16px">
      <div style="font-weight:700;font-size:18px" id="res-no"></div>
      <div class="muted" id="res-info"></div>
      <div class="muted small" id="res-hint" style="margin-top:4px"></div>
    </div>
    <a class="btn btn-block" href="/student/my.html" style="margin-top:24px">내 예약으로</a>
  </main>
  <nav class="m-tabs" aria-label="학생 메뉴">
    <a href="/student/menus.html">오늘의 메뉴</a>
    <a href="/student/my.html" class="active" aria-current="page">내 예약</a>
  </nav>
</div>
<script src="/js/common.js"></script>
<script>
/* TicketPage.init(id) — 설계서 5.5: QR 이미지(한 변 200px 이상)와 예약 정보를 표시한다. */
(async () => {
  if (!await requireRole('STUDENT')) return;
  const id = queryParam('id');
  try {
    const t = await api('GET', '/api/reservations/' + encodeURIComponent(id) + '/ticket');
    document.getElementById('res-no').textContent = '예약 번호 ' + t.reservationId;
    document.getElementById('res-info').textContent =
      t.menuName + ' ' + t.quantity + '개 · ' + slotLabel(t.startTime, t.endTime);
    const qr = document.getElementById('qr');
    if (t.ticketStatus === 'VALID' && t.reservationStatus === 'RESERVED') {
      qr.innerHTML = '<img alt="식권 QR 코드" src="/api/reservations/' + t.reservationId + '/ticket/qr?ts=' + Date.now() + '">';
      document.getElementById('res-hint').textContent = '수령 시 관리자에게 보여 주세요';
    } else {
      const reason = t.reservationStatus === 'PICKED_UP' ? '이미 수령한 식권입니다' : '취소되어 사용할 수 없는 식권입니다';
      qr.innerHTML = '<div class="qr-unusable">' + reason + '</div>';
    }
  } catch (e) {
    document.getElementById('qr').innerHTML = '<div class="qr-unusable">' + escapeHtml(e.message) + '</div>';
  }
})();
</script>
</body>
</html>
