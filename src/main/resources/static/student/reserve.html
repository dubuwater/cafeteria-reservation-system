<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>예약하기 · 학식 예약</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="m-app">
  <header class="m-top">
    <button class="back" type="button" aria-label="뒤로 가기" onclick="history.back()">‹</button>
    <h1>예약하기</h1>
    <button class="btn-link" type="button" onclick="logout()">로그아웃</button>
  </header>
  <!-- S03 예약하기 (FR-04~05, UC-04) -->
  <main class="m-main">
    <div id="menu-info" style="font-weight:700;font-size:17px"></div>
    <div class="section-label">수량(1~3)</div>
    <div class="stepper">
      <button type="button" id="minus" aria-label="수량 줄이기">−</button>
      <span class="value" id="qty" aria-live="polite">1</span>
      <button type="button" id="plus" aria-label="수량 늘리기">+</button>
    </div>
    <div class="section-label" id="slot-label">수령 시간대</div>
    <div id="slots" role="radiogroup" aria-labelledby="slot-label" aria-describedby="slot-error"></div>
    <div class="field-error" id="slot-error" role="alert"></div>
    <div class="total"><span>총 금액</span><span id="total">0원</span></div>
    <button class="btn btn-primary btn-block" id="pay" type="button" disabled>결제하기</button>
  </main>
  <nav class="m-tabs" aria-label="학생 메뉴">
    <a href="/student/menus.html" class="active" aria-current="page">오늘의 메뉴</a>
    <a href="/student/my.html">내 예약</a>
  </nav>
</div>
<script src="/js/common.js"></script>
<script>
/* ReservePage — 설계서 5.2 */
const menuId = queryParam('menuId');
const state = { menu: null, qty: 1, slotId: null, submitting: false };
const payButton = document.getElementById('pay');
const slotError = document.getElementById('slot-error');

/* ReservePage.init(menuId): 메뉴와 식사 구분에 맞는 시간대를 불러와 마감 시간대를 비활성화한다(FR-04, DR-12). */
async function init() {
  const data = await api('GET', '/api/menus/' + encodeURIComponent(menuId) + '/slots');
  state.menu = data.menu;
  document.getElementById('menu-info').textContent =
    data.menu.name + ' · ' + won(data.menu.price) + ' · ' + MEAL_LABEL[data.menu.mealType];
  document.getElementById('slot-label').textContent = '수령 시간대(' + MEAL_LABEL[data.menu.mealType] + ')';
  const soldOut = data.menu.remainingQuantity === 0;
  if (soldOut || !data.slots.some(s => s.slotId === state.slotId && !s.full)) state.slotId = null;
  document.getElementById('slots').innerHTML = data.slots.map(s => `
    <label class="option${soldOut || s.full ? ' disabled' : ''}${state.slotId === s.slotId ? ' selected' : ''}">
      <input type="radio" name="slot" value="${s.slotId}" ${soldOut || s.full ? 'disabled' : ''} ${state.slotId === s.slotId ? 'checked' : ''}>
      <span>${slotLabel(s.startTime, s.endTime)}</span>
      <span class="tail">${s.full ? '마감' : '여유 ' + (s.capacity - s.reservedCount) + '건'}</span>
    </label>`).join('') || '<div class="muted">선택할 수 있는 시간대가 없습니다</div>';
  document.querySelectorAll('input[name=slot]').forEach(r => r.addEventListener('change', () => {
    state.slotId = Number(r.value);
    document.querySelectorAll('.option').forEach(o => o.classList.toggle('selected', o.contains(r)));
    slotError.textContent = '';
    updatePayButton();
  }));
  if (soldOut) slotError.textContent = '품절된 메뉴입니다';
  onQtyChange(0);
  updatePayButton();
}

function updatePayButton() {
  payButton.disabled = state.submitting || state.slotId === null || !state.menu?.remainingQuantity;
}

/* ReservePage.onQtyChange(delta): 수량을 1~3, 남은 수량 이하로 제한하고 총액을 즉시 갱신한다. */
function onQtyChange(delta) {
  if (!state.menu) return;
  const maxQty = Math.min(3, state.menu.remainingQuantity);
  state.qty = Math.min(Math.max(state.qty + delta, 1), maxQty);
  document.getElementById('qty').textContent = state.qty;
  document.getElementById('minus').disabled = state.qty <= 1;
  document.getElementById('plus').disabled = state.qty === maxQty;
  document.getElementById('total').textContent = won(state.menu.price * state.qty);
}

/* ReservePage.onPay(): 결제대기 예약을 만들고 결제 화면(S04)으로 이동한다(FR-05). */
async function onPay() {
  if (payButton.disabled) return;
  state.submitting = true;
  setBusy(payButton, true);
  try {
    const r = await api('POST', '/api/reservations', { menuId: state.menu.menuId, slotId: state.slotId, quantity: state.qty });
    location.href = '/student/pay.html?id=' + r.reservationId;
  } catch (err) {
    slotError.textContent = err.message;
    try {
      await init();
    } catch (refreshError) {
      state.slotId = null;
      slotError.textContent = refreshError.message;
    }
    state.submitting = false;
    setBusy(payButton, false);
    updatePayButton();
  }
}

document.getElementById('minus').addEventListener('click', () => onQtyChange(-1));
document.getElementById('plus').addEventListener('click', () => onQtyChange(1));
payButton.addEventListener('click', onPay);

(async () => {
  if (!await requireRole('STUDENT')) return;
  if (!menuId) { location.replace('/student/menus.html'); return; }
  try { await init(); } catch (e) { showToast(e.message); setTimeout(() => location.replace('/student/menus.html'), 1500); }
})();
</script>
</body>
</html>
