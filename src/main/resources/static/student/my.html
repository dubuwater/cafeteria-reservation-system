<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 예약 · 학식 예약</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="m-app">
  <header class="m-top">

    <h1>내 예약</h1>
    <button class="btn-link" type="button" onclick="logout()">로그아웃</button>
  </header>
  <!-- S06 내 예약 (FR-08, FR-10~11, UC-07, UC-09~10) -->
  <main class="m-main">
    <div id="list"></div>
  </main>
  <nav class="m-tabs" aria-label="학생 메뉴">
    <a href="/student/menus.html">오늘의 메뉴</a>
    <a href="/student/my.html" class="active" aria-current="page">내 예약</a>
  </nav>
</div>
<script src="/js/common.js"></script>
<script>
/* MyPage.init() — 설계서 5.3: 최신순 목록, 취소 가능 여부는 서버의 canCancel() 결과를 그대로 쓴다. */
async function init() {
  const list = await api('GET', '/api/reservations/me');
  const box = document.getElementById('list');
  if (list.length === 0) { box.innerHTML = '<div class="empty">예약 내역이 없습니다</div>'; return; }
  box.innerHTML = list.map(r => `
    <div class="card res-item">
      <div class="head">
        <div style="font-weight:700">#${r.reservationId} ${escapeHtml(r.menuName)} ${r.quantity}개</div>
        ${statusBadge(r.status)}
      </div>
      <div class="muted small">${r.saleDate} ${MEAL_LABEL[r.mealType]} ${slotLabel(r.startTime, r.endTime)} · ${won(r.totalPrice)}</div>
      ${r.status === 'CANCELED' ? '<div class="small" style="color:var(--danger)">환불 완료</div>' : ''}
      ${r.status === 'RESERVED' ? `
        <div class="actions">
          <a class="btn btn-sm" href="/student/ticket.html?id=${r.reservationId}">식권 보기</a>
          <button class="btn btn-sm btn-danger" type="button" data-cancel="${r.reservationId}" ${r.cancellable ? '' : 'disabled'}
            title="${r.cancellable ? '' : '수령 시간 시작 30분 전까지만 취소할 수 있습니다'}">취소</button>
        </div>
        ${r.cancellable ? '' : '<div class="muted small" style="text-align:right;margin-top:4px">취소 가능 시간이 지났습니다</div>'}` : ''}
    </div>`).join('');
  box.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', () => onCancel(b)));
}

/* MyPage.onCancel(reservationId): 확인 창을 거쳐 취소 API를 호출하고 결과를 안내한다(FR-10~11, NFR-06). */
async function onCancel(button) {
  if (!confirm('예약을 취소하고 환불받으시겠습니까?')) return;
  setBusy(button, true);
  try {
    await api('POST', '/api/reservations/' + button.dataset.cancel + '/cancel');
    showToast('환불되었습니다');
  } catch (err) {
    showToast(err.message);
  } finally {
    await init();                   // 상태와 버튼을 서버 기준으로 다시 그린다
  }
}

(async () => {
  if (!await requireRole('STUDENT')) return;
  try { await init(); } catch (e) { showToast(e.message); }
})();
</script>
</body>
</html>
