<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 학식 예약</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<!-- S01 로그인 (FR-01, UC-01) -->
<main class="login">
  <div class="brand">
    <h1>학식 예약</h1>
    <div class="muted">학생식당 사전 예약</div>
  </div>
  <form id="login-form" novalidate>
    <div class="field">
      <label for="login-id">학번 또는 아이디</label>
      <input class="input" id="login-id" name="id" autocomplete="username" autofocus>
      <div class="field-error" id="login-id-error"></div>
    </div>
    <div class="field">
      <label for="login-pw">비밀번호</label>
      <input class="input" id="login-pw" name="pw" type="password" autocomplete="current-password">
      <div class="field-error" id="login-pw-error"></div>
    </div>
    <button class="btn btn-primary btn-block" id="login-button" type="submit">로그인</button>
  </form>
</main>
<script src="/js/common.js"></script>
<script>
/*---------------------------------------------------------------------
1) 함수명: void LoginPage.onSubmit(Event e) — 설계서 5.1
3) 기능: 입력을 검사하고 로그인 API를 호출한 뒤 역할에 맞는 첫 화면으로 이동한다(FR-01).
---------------------------------------------------------------------*/
const form = document.getElementById('login-form');
const idInput = document.getElementById('login-id');
const pwInput = document.getElementById('login-pw');
const loginButton = document.getElementById('login-button');

// 이미 로그인되어 있으면 첫 화면으로 보낸다. 이 요청으로 XSRF-TOKEN 쿠키도 받는다.
fetch('/api/auth/me', { credentials: 'same-origin' })
  .then(r => r.ok ? r.json() : null)
  .then(me => { if (me) location.replace(homeOf(me.role)); })
  .catch(() => {});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearFieldErrors();
  // 1. 빈 값이면 입력란 아래에 메시지를 표시하고 요청하지 않는다(NFR-06).
  if (idInput.value.trim() === '') { showFieldError(idInput, '아이디를 입력하세요'); return; }
  if (pwInput.value === '') { showFieldError(pwInput, '비밀번호를 입력하세요'); return; }
  // 2. 중복 클릭을 막는다(NFR-05).
  setBusy(loginButton, true);
  try {
    const res = await api('POST', '/api/auth/login', { id: idInput.value.trim(), pw: pwInput.value });
    // 3. 역할에 따라 이동한다(학생 S02, 관리자 A01).
    location.replace(homeOf(res.role));
  } catch (err) {
    // 4. 계정 존재 여부를 드러내지 않는 같은 메시지를 표시한다.
    showFieldError(pwInput, err.code === 'LOGIN_FAILED' ? '아이디 또는 비밀번호가 올바르지 않습니다' : err.message);
    pwInput.value = '';
    setBusy(loginButton, false);
  }
});
</script>
</body>
</html>
